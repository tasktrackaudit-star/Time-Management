<script>

// ================= Persistence (localStorage) =================
// Keeps you signed in and keeps every change (new employees, uploaded
// attendance, leave approvals, holidays, settings) across page refreshes.
// This is per-browser storage, separate from the real Google Sheet — once
// you connect the Apps Script URL, uploads also go to the Sheet, but this
// local copy is what re-loads instantly on refresh.
const PERSIST_KEY = "tf_app_state_v1";
const PERSIST_FIELDS = ["session","tab","apiUrl","employees","attendance","attendanceByDate","holidays","leaves","settings","payrollMock"];

function loadPersistedState(){
  try{
    const raw = localStorage.getItem(PERSIST_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    if(!saved.attendanceByDate) saved.attendanceByDate = {};
    return { ...saved, ui: { showAddEmp:false, showAddHoliday:false, loginMode:"admin", loginError:"", testState:{status:"idle"} } };
  }catch(err){ return null; }
}

function persistState(){
  try{
    const toSave = {};
    PERSIST_FIELDS.forEach(k => { toSave[k] = state[k]; });
    localStorage.setItem(PERSIST_KEY, JSON.stringify(toSave));
  }catch(err){ /* storage full or unavailable — app still works, just won't persist */ }
}

function resetAppData(){
  if(!confirm("This clears all saved employees, attendance, leaves, holidays, and settings from this browser and reloads the original demo data. Continue?")) return;
  localStorage.removeItem(PERSIST_KEY);
  location.reload();
}

let state = loadPersistedState() || {

  tab: "dashboard",
  apiUrl: localStorage.getItem("tf_apiUrl") || "",

function toMinutes(t){ if(!t) return null; const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m) return null;
  let h=parseInt(m[1],10), min=parseInt(m[2],10); if(/pm/i.test(m[3]) && h!==12) h+=12; if(/am/i.test(m[3]) && h===12) h=0;
  return h*60+min; }
function fmtDur(mins){ if(mins==null||isNaN(mins)) return "--"; const sign=mins<0?"-":""; mins=Math.abs(Math.round(mins));
  return `${sign}${Math.floor(mins/60)}h ${mins%60}m`; }
function computeRecord(rec, settings){
  const start=toMinutes(settings.officeStart), end=toMinutes(settings.officeEnd);
  const ci=toMinutes(rec.checkIn), co=toMinutes(rec.checkOut);
  if(ci==null||co==null) return { netMinutes:null, lateBy:0, earlyBy:0, overtime:0 };
  const po=toMinutes(rec.personalOut), pi=toMinutes(rec.personalIn);
  const personalMinutes=(po!=null&&pi!=null&&pi>po)?(pi-po):0;
  const netMinutes=Math.max((co-ci)-settings.lunchMinutes-personalMinutes,0);
  return { netMinutes, lateBy:Math.max(ci-(start+settings.graceMinutes),0), earlyBy:Math.max(end-co,0), overtime:Math.max(co-end,0) };
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function dayTimelineHtml(rec, settings, compact){
  const cls = "timeline" + (compact ? " compact" : "");
  if(rec.status==="leave") return `<div class="status-bar" style="background:var(--info-soft);color:var(--info)">On leave — ${esc(rec.leaveType)}</div>`;
  if(rec.status==="absent"||!rec.checkIn) return `<div class="status-bar" style="background:var(--danger-soft);color:var(--danger)">Absent</div>`;
  const start=toMinutes(settings.officeStart), end=toMinutes(settings.officeEnd);
  const domainStart=start-45, domainEnd=end+45, span=domainEnd-domainStart;
  const pct=m=>Math.min(100,Math.max(0,((m-domainStart)/span)*100));
  const ci=toMinutes(rec.checkIn), co=toMinutes(rec.checkOut)||end;
  const po=toMinutes(rec.personalOut), pi=toMinutes(rec.personalIn);
  const lunchMid=(start+end)/2, lunchStart=lunchMid-settings.lunchMinutes/2, lunchEnd=lunchMid+settings.lunchMinutes/2;
  let segs=[];
  segs.push({from:ci,to:Math.min(co,lunchStart),bg:"var(--accent)"});
  segs.push({from:lunchStart,to:lunchEnd,bg:"repeating-linear-gradient(45deg,#D8D9CE,#D8D9CE 3px,#EEEFE7 3px,#EEEFE7 6px)"});
  let secondStart=lunchEnd;
  if(po!=null&&pi!=null&&pi>po){
    segs.push({from:secondStart,to:po,bg:"var(--accent)"});
    segs.push({from:po,to:pi,bg:"var(--info)",dashed:true});
    secondStart=pi;
  }
  segs.push({from:secondStart,to:co,bg:"var(--accent)"});
  const html = segs.filter(s=>s.to>s.from).map(s=>{
    const left=pct(s.from), width=pct(s.to)-pct(s.from);
    const border = s.dashed ? "border:1px dashed var(--info);opacity:0.85;" : "";
    return `<div class="seg" style="left:${left}%;width:${width}%;background:${s.bg};${border}"></div>`;
  }).join("");
  return `<div class="${cls}">${html}</div>`;
}

function save(){ render(); }
function setState(patch){ Object.assign(state, patch); render(); }

// ================= Excel parsing =================
function normalizeKey(k){ return String(k).toLowerCase().replace(/[^a-z]/g,""); }
function readValue(row, ...aliases){
  const keys=Object.keys(row);
  for(const a of aliases){ const t=normalizeKey(a); const f=keys.find(k=>normalizeKey(k)===t);
    if(f && row[f]!==undefined && row[f]!=="") return String(row[f]).trim(); }
  return "";
}
function parseAttendanceWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:"array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:"" });
  const result = {};
  rows.forEach(row=>{
    const empId = readValue(row,"Employee ID","EmpID","ID","Employee Id");
    if(!empId) return;
    const status = readValue(row,"Status").toLowerCase();
    if(status==="leave"||status==="on leave"){ result[empId]={status:"leave", leaveType:readValue(row,"Leave Type")||"Leave"}; return; }
    if(status==="absent"){ result[empId]={status:"absent"}; return; }
    const checkIn=readValue(row,"Check In","CheckIn"), checkOut=readValue(row,"Check Out","CheckOut");
    const personalOut=readValue(row,"Personal Out","PersonalOut"), personalIn=readValue(row,"Personal In","PersonalIn");
    result[empId] = (!checkIn && !checkOut) ? {status:"absent"} : {status:"present", checkIn, checkOut, personalOut, personalIn};
  });
  return result;
}

// ---- Biometric punching-machine "DateWise Performance" export ----
// Format: one block per employee ("EmpCode ... Name ...", then a
// "Date, Shift, ArrTim, Out1, In2, ..., DepTim, WrkHrs" table with one row
// per day of the month, ending at a "Total For Employee :" row). Times are
// stored as decimal HH.MM (9.37 means 9:37), not true decimal hours.
function decimalTimeToClock(val){
  if(val === undefined || val === null || val === "") return "";
  const num = Number(val);
  if(isNaN(num) || num <= 0) return "";
  let h = Math.floor(num);
  let m = Math.round((num - h) * 100);
  if(m >= 60){ h += Math.floor(m/60); m = m % 60; }
  if(h >= 24) return "";
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ap}`;
}
function cellToISODate(val){
  if(val instanceof Date){
    const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,"0"), d=String(val.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  if(typeof val === "string"){
    const m = val.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  }
  if(typeof val === "number" && typeof XLSX.SSF !== "undefined"){
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
  }
  return null;
}
function looksLikeMachineExport(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:"array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
  return rows.some(r => String(r[0]).trim() === "EmpCode");
}
function parseAttendanceMachineExport(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, { type:"array", cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });

  const blocks = [];
  for(let i=0;i<rows.length;i++){
    if(String(rows[i][0]).trim() === "EmpCode"){
      blocks.push({ code: String(rows[i][1]).trim(), name: String(rows[i][6] || rows[i][5] || "").trim(), headerRow: i });
    }
  }

  const records = []; // { empCode, empName, date, checkIn, personalOut, personalIn, checkOut, status }
  blocks.forEach(block => {
    let dateHeaderRow = -1;
    for(let i=block.headerRow; i<block.headerRow+8 && i<rows.length; i++){
      if(String(rows[i][0]).trim() === "Date"){ dateHeaderRow = i; break; }
    }
    if(dateHeaderRow === -1) return;
    for(let i=dateHeaderRow+1; i<rows.length; i++){
      const r = rows[i];
      const first = String(r[0]).trim();
      if(first.startsWith("Total For Employee")) break;
      if(!first) continue;
      const iso = cellToISODate(r[0]);
      if(!iso) continue;
      const checkIn = decimalTimeToClock(r[2]);
      const personalOut = decimalTimeToClock(r[3]);
      const personalIn = decimalTimeToClock(r[4]);
      const checkOut = decimalTimeToClock(r[15]);
      records.push({
        empCode: block.code, empName: block.name, date: iso,
        status: checkIn ? "present" : "absent",
        checkIn, personalOut, personalIn, checkOut,
      });
    }
  });
  return { employees: blocks.map(b => ({ code:b.code, name:b.name })), records };
}


// ================= Google Sheet API helpers =================
async function apiPost(action, payload){
  if(!state.apiUrl) return null;
  try{
    const res = await fetch(state.apiUrl, { method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify({ action, ...payload }) });
    return await res.json();
  }catch(err){ console.error("apiPost failed:", action, err); return { error: String(err) }; }
}
async function apiGet(action){
  if(!state.apiUrl) return null;
  try{
    const res = await fetch(`${state.apiUrl}?action=${action}`);
    return await res.json();
  }catch(err){ console.error("apiGet failed:", action, err); return null; }
}

// Pulls Employees, Holidays, Leave, Settings, today's Attendance, and this
// month's Payroll straight from the connected Google Sheet and replaces the
// local working copy with it — the Sheet is the source of truth once
// connected, this just mirrors it into the app.
async function syncFromSheet(){
  if(!state.apiUrl) return { success:false, error:"No Apps Script URL configured." };
  state.ui.syncingFromSheet = true; render();
  try{
    const [empRes, holRes, leaveRes, setRes, attRes, payRes] = await Promise.all([
      apiGet("getEmployees"), apiGet("getHolidays"), apiGet("getLeaves"),
      apiGet("getSettings"), apiGet("getAttendance"), apiGet("getPayroll"),
    ]);

    if(Array.isArray(empRes)){
      state.employees = empRes.map(r => ({
        id: String(r.EmployeeID), name: r.Name, dept: r.Department, designation: r.Designation,
        doj: r.DateOfJoining, salary: Number(r.MonthlySalary) || 0, phone: r.ContactNumber, status: r.Status || "Active",
      })).filter(e => e.id);
    }
    if(Array.isArray(holRes)){
      state.holidays = holRes.map((r,i) => ({ id: i+1, date: r.Date, name: r.HolidayName })).filter(h => h.date);
    }
    if(Array.isArray(leaveRes)){
      state.leaves = leaveRes.map(r => ({
        id: r.LeaveID, empId: String(r.EmployeeID), name: (state.employees.find(e=>e.id===String(r.EmployeeID))||{}).name || r.EmployeeID,
        type: r.Type, from: r.FromDate, to: r.ToDate, status: r.Status,
      })).filter(l => l.empId);
    }
    if(setRes && !setRes.error){
      state.settings = {
        officeStart: setRes.OfficeStart || state.settings.officeStart,
        officeEnd: setRes.OfficeEnd || state.settings.officeEnd,
        lunchMinutes: Number(setRes.LunchMinutes) || state.settings.lunchMinutes,
        graceMinutes: Number(setRes.GraceMinutes) || state.settings.graceMinutes,
        weeklyOff: setRes.WeeklyOff || state.settings.weeklyOff,
        workingDaysPerMonth: Number(setRes.WorkingDaysPerMonth) || state.settings.workingDaysPerMonth,
      };
    }
    if(Array.isArray(attRes)){
      const newAttendance = {};
      const newByDate = {};
      attRes.forEach(r => {
        const id = String(r.EmployeeID);
        const date = String(r.Date);
        if(!date || !id) return;
        const status = String(r.Status || "").toLowerCase();
        let rec;
        if(status === "leave") rec = { status:"leave", leaveType: r.LeaveType || "Leave" };
        else if(status === "absent" || (!r.CheckIn && !r.CheckOut)) rec = { status:"absent" };
        else rec = { status:"present", checkIn:r.CheckIn||"", personalOut:r.PersonalOut||"", personalIn:r.PersonalIn||"", checkOut:r.CheckOut||"" };
        if(!newByDate[date]) newByDate[date] = {};
        newByDate[date][id] = rec;
        if(date === TODAY_ISO) newAttendance[id] = rec;
      });
      state.attendance = newAttendance;
      state.attendanceByDate = newByDate;
    }
    if(Array.isArray(payRes)){
      const thisMonth = payRes.filter(r => String(r.Month) === "2026-08");
      const newPayroll = {};
      thisMonth.forEach(r => {
        newPayroll[String(r.EmployeeID)] = {
          presentDays: Number(r.PresentDays) || 0, leaveDays: Number(r.LeaveDays) || 0, lateCount: Number(r.LateCount) || 0,
        };
      });
      state.payrollMock = newPayroll;
    }
    state.ui.syncingFromSheet = false;
    render();
    return { success:true };
  }catch(err){
    state.ui.syncingFromSheet = false;
    render();
    return { success:false, error:String(err) };
  }
}

async function adminLogin(username, password){
  if(state.apiUrl){
    const res = await fetch(state.apiUrl, { method:"POST", headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({ action:"login", username, password }) });
    return await res.json();
  }
  if(username===DEMO_ADMIN.username && password===DEMO_ADMIN.password) return { success:true, name:"Admin", demo:true };
  return { success:false, error:"Invalid username or password" };
}

function attachLoginHandlers(){
  const submit = document.getElementById("login-submit");
  if(submit) submit.onclick = async () => {
    const username = document.getElementById("login-username").value;
    const password = document.getElementById("login-password").value;
    submit.textContent = "Signing in…";
    try{
      const result = await adminLogin(username, password);
      if(result.success){
        state.session = { role:"admin", name: result.name || username };
        render();
        if(state.apiUrl) syncFromSheet();
      }
      else { setState({ui:{...state.ui, loginError: result.error || "Invalid username or password"}}); }
    }catch(err){ setState({ui:{...state.ui, loginError:"Couldn't reach the login service. Check the Apps Script URL in Settings."}}); }
  };
  const empLogin = document.getElementById("emp-login");
  if(empLogin) empLogin.onclick = () => {
    const empId = document.getElementById("emp-select").value;
    state.session = { role:"employee", empId };
    render();
  };
}

function computePayrollRows(){
  return state.employees.filter(e=>e.status==="Active" && state.payrollMock[e.id]).map(e=>{
    const p = state.payrollMock[e.id];
    const paidDays = p.presentDays + p.leaveDays;
    const perDay = e.salary / state.settings.workingDaysPerMonth;
    const deduction = Math.max(state.settings.workingDaysPerMonth - paidDays, 0) * perDay;
    const lateDeduction = p.lateCount > 3 ? (p.lateCount - 3) * perDay * 0.25 : 0;
    const net = Math.max(e.salary - deduction - lateDeduction, 0);
    return { ...e, ...p, paidDays, deduction: deduction+lateDeduction, net };
  });
}

const REPORTS = [
  { key:"daily", label:"Daily attendance report" },
  { key:"monthly", label:"Monthly attendance report" },
  { key:"history", label:"Employee attendance history" },
  { key:"late", label:"Late arrival report" },
  { key:"personal", label:"Personal outside time report" },
  { key:"leave", label:"Leave report" },
  { key:"payroll", label:"Payroll report" },
  { key:"salary", label:"Salary slip" },
];

function reportRows(key){
  const active = state.employees.filter(e=>e.status==="Active");
  switch(key){
    case "daily":
    case "history":
      return active.map(e=>{
        const r = state.attendance[e.id] || { status:"absent" };
        return { Employee:e.name, Date:TODAY_ISO, Status:r.status, CheckIn:r.checkIn||"", PersonalOut:r.personalOut||"", PersonalIn:r.personalIn||"", CheckOut:r.checkOut||"" };
      });
    case "monthly":
      return active.filter(e=>state.payrollMock[e.id]).map(e=>{
        const p = state.payrollMock[e.id];
        return { Employee:e.name, Month:"2026-08", PresentDays:p.presentDays, LeaveDays:p.leaveDays, LateCount:p.lateCount };
      });
    case "late":
      return active.filter(e=>{ const r=state.attendance[e.id]; return r && r.status==="present" && computeRecord(r,state.settings).lateBy>0; })
        .map(e=>{ const r=state.attendance[e.id]; const c=computeRecord(r,state.settings);
          return { Employee:e.name, CheckIn:r.checkIn, LateBy:fmtDur(c.lateBy) }; });
    case "personal":
      return active.filter(e=>{ const r=state.attendance[e.id]; return r && r.personalOut && r.personalIn; })
        .map(e=>{ const r=state.attendance[e.id]; const po=toMinutes(r.personalOut), pi=toMinutes(r.personalIn);
          return { Employee:e.name, PersonalOut:r.personalOut, PersonalIn:r.personalIn, Duration: fmtDur(pi-po) }; });
    case "leave":
      return state.leaves.map(l=>({ Employee:l.name, Type:l.type, From:l.from, To:l.to, Status:l.status }));
    case "payroll":
    case "salary":
      return computePayrollRows().map(r=>({
        Employee:r.name, PresentDays:r.presentDays, LeaveDays:r.leaveDays, PaidDays:r.paidDays,
        LateCount:r.lateCount, GrossSalary:r.salary, Deductions:Math.round(r.deduction), NetSalary:Math.round(r.net),
      }));
    default: return [];
  }
}

function exportExcel(key, label){
  const rows = reportRows(key);
  if(!rows.length){ alert("No data available for this report yet."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Report");
  XLSX.writeFile(wb, `${key}-${TODAY_ISO}.xlsx`);
}

function exportPdf(key, label){
  const rows = reportRows(key);
  if(!rows.length){ alert("No data available for this report yet."); return; }
  const headers = Object.keys(rows[0]);
  const win = window.open("", "_blank");
  if(!win){ alert("Your browser blocked the print window. Allow popups for this page and try again."); return; }
  win.document.write(`<html><head><title>${esc(label)}</title><style>
    body{font-family:Arial,sans-serif;padding:24px;color:#182338;}
    h1{font-size:18px;margin-bottom:4px;} p{font-size:12px;color:#3A4560;margin-top:0;}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px;}
    th,td{border:1px solid #E2E3DA;padding:6px 8px;text-align:left;} th{background:#F6F6F0;}
  </style></head><body>
    <h1>${esc(label)}</h1><p>${TODAY_LABEL}</p>
    <table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join("")}</tr>`).join("")}</tbody></table>
  </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(), 300);
}

  return `

function wireEmployees(){
  const toggleAdd = document.getElementById("toggle-add-emp");
  if(toggleAdd) toggleAdd.onclick = () => setState({ui:{...state.ui, showAddEmp: !state.ui.showAddEmp, editEmpId:null}});
  const cancel = document.getElementById("cancel-emp");
  if(cancel) cancel.onclick = () => setState({ui:{...state.ui, showAddEmp:false, editEmpId:null}});
  const saveBtn = document.getElementById("save-emp");
  if(saveBtn) saveBtn.onclick = async () => {
    const name = document.getElementById("emp-name").value.trim();
    if(!name) return;
    const fields = {
      name,
      dept: document.getElementById("emp-dept").value,
      designation: document.getElementById("emp-designation").value,
      doj: document.getElementById("emp-doj").value,
      salary: Number(document.getElementById("emp-salary").value) || 0,
      phone: document.getElementById("emp-phone").value,
    };

    if(state.ui.editEmpId){
      const emp = state.employees.find(e => e.id === state.ui.editEmpId);
      if(!emp) return;
      Object.assign(emp, fields);
      setState({ui:{...state.ui, showAddEmp:false, editEmpId:null}});
      if(state.apiUrl){
        const result = await apiPost("updateEmployee", { employeeId: emp.id, fields: {
          Name: emp.name, Department: emp.dept, Designation: emp.designation,
          DateOfJoining: emp.doj, MonthlySalary: emp.salary, ContactNumber: emp.phone,
        }});
        if(!result || result.error) alert("Saved locally, but couldn't update Google Sheet: " + (result && result.error ? result.error : "no response"));
      }
      return;
    }

    const maxNum = state.employees.reduce((max, e) => {
      const n = parseInt(String(e.id).replace(/\D/g,""), 10);
      return isNaN(n) ? max : Math.max(max, n);
    }, 0);
    const id = "E" + String(maxNum + 1).padStart(3,"0");
    const newEmp = { id, status:"Active", ...fields };
    state.employees.push(newEmp);
    setState({ui:{...state.ui, showAddEmp:false, editEmpId:null}});
    if(state.apiUrl){
      const result = await apiPost("addEmployee", { employee: {
        EmployeeID: newEmp.id, Name: newEmp.name, Department: newEmp.dept, Designation: newEmp.designation,
        DateOfJoining: newEmp.doj, MonthlySalary: newEmp.salary, ContactNumber: newEmp.phone, Status: newEmp.status,
      }});
      if(!result || result.error) alert("Saved locally, but couldn't write to Google Sheet: " + (result && result.error ? result.error : "no response"));
    }
  };
  document.querySelectorAll("[data-edit-emp]").forEach(b => b.onclick = () => {
    setState({ui:{...state.ui, showAddEmp:true, editEmpId:b.dataset.editEmp}});
  });
  document.querySelectorAll("[data-toggle-status]").forEach(b => b.onclick = async () => {
    const id = b.dataset.toggleStatus;
    const emp = state.employees.find(e=>e.id===id);
    emp.status = emp.status === "Active" ? "Inactive" : "Active";
    render();
    if(state.apiUrl) await apiPost("updateEmployee", { employeeId:id, fields:{ Status: emp.status } });
  });
  document.querySelectorAll("[data-remove-emp]").forEach(b => b.onclick = async () => {
    const id = b.dataset.removeEmp;
    const emp = state.employees.find(e=>e.id===id);
    if(!confirm(`Remove ${emp ? emp.name : id} completely? This also removes their attendance, leave, and payroll records.`)) return;
    state.employees = state.employees.filter(e => e.id !== id);
    delete state.attendance[id];
    delete state.payrollMock[id];
    state.leaves = state.leaves.filter(l => l.empId !== id);
    render();
    if(state.apiUrl){
      const result = await apiPost("deleteEmployee", { employeeId:id });
      if(!result || result.error) alert("Removed locally, but couldn't remove from Google Sheet: " + (result && result.error ? result.error : "no response"));
    }
  });
}

function normalizeName(n){ return String(n||"").toLowerCase().replace(/\s+/g," ").trim(); }
function findOrCreateEmployee(name){
  const norm = normalizeName(name);
  if(!norm) return null;
  let emp = state.employees.find(e => normalizeName(e.name) === norm);
  if(emp) return { emp, created:false };
  const maxNum = state.employees.reduce((max, e) => {
    const n = parseInt(String(e.id).replace(/\D/g,""), 10);
    return isNaN(n) ? max : Math.max(max, n);
  }, 0);
  const id = "E" + String(maxNum + 1).padStart(3,"0");
  emp = { id, name: name.trim(), dept:"", designation:"", doj:"", salary:0, phone:"", status:"Active" };
  state.employees.push(emp);
  return { emp, created:true };
}

function wireAttendance(){
  const chooseBtn = document.getElementById("choose-file-btn");
  const fileInput = document.getElementById("excel-file");
  if(chooseBtn) chooseBtn.onclick = () => fileInput.click();
  if(fileInput) fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if(!file) return;
    state.ui.syncState = { status:"parsing", fileName:file.name };
    render();
    try{
      const buffer = await file.arrayBuffer();

      if(looksLikeMachineExport(buffer)){
        const { records } = parseAttendanceMachineExport(buffer);
        if(records.length === 0) throw new Error("Couldn't find any daily rows in this file — is it a punching-machine 'DateWise Performance' export?");

        const createdNames = [];
        const empIdByName = {};
        records.forEach(r => {
          const norm = normalizeName(r.empName);
          if(!(norm in empIdByName)){
            const found = findOrCreateEmployee(r.empName);
            empIdByName[norm] = found.emp.id;
            if(found.created) createdNames.push(r.empName);
          }
        });

        const dates = new Set();
        records.forEach(r => {
          const empId = empIdByName[normalizeName(r.empName)];
          dates.add(r.date);
          if(!state.attendanceByDate[r.date]) state.attendanceByDate[r.date] = {};
          const rec = r.status === "present"
            ? { status:"present", checkIn:r.checkIn, personalOut:r.personalOut, personalIn:r.personalIn, checkOut:r.checkOut }
            : { status:"absent" };
          state.attendanceByDate[r.date][empId] = rec;
          if(r.date === TODAY_ISO) state.attendance[empId] = rec;
        });

        const affectedEmpIds = [...new Set(Object.values(empIdByName))];
        affectedEmpIds.forEach(empId => {
          let presentDays = 0, lateCount = 0;
          dates.forEach(d => {
            const rec = (state.attendanceByDate[d] || {})[empId];
            if(!rec || rec.status !== "present") return;
            presentDays++;
            if(computeRecord(rec, state.settings).lateBy > 0) lateCount++;
          });
          const existingLeave = (state.payrollMock[empId] && state.payrollMock[empId].leaveDays) || 0;
          state.payrollMock[empId] = { presentDays, leaveDays: existingLeave, lateCount };
        });

        const sortedDates = [...dates].sort();
        const monthKey = sortedDates.length ? sortedDates[0].slice(0,7) : "";

        if(state.apiUrl){
          for(const name of createdNames){
            const emp = state.employees.find(e => normalizeName(e.name) === normalizeName(name));
            await apiPost("addEmployee", { employee: {
              EmployeeID: emp.id, Name: emp.name, Department: emp.dept, Designation: emp.designation,
              DateOfJoining: emp.doj, MonthlySalary: emp.salary, ContactNumber: emp.phone, Status: emp.status,
            }});
          }
          const rows = records.map(r => ({
            Date: r.date, EmployeeID: empIdByName[normalizeName(r.empName)],
            CheckIn: r.checkIn||"", PersonalOut: r.personalOut||"", PersonalIn: r.personalIn||"", CheckOut: r.checkOut||"",
            Status: r.status === "present" ? "Present" : "Absent", LeaveType: "",
          }));
          await apiPost("uploadAttendance", { rows });
          const payrollRows = affectedEmpIds.map(empId => {
            const emp = state.employees.find(e=>e.id===empId);
            const p = state.payrollMock[empId];
            const perDay = emp.salary / state.settings.workingDaysPerMonth;
            const paidDays = p.presentDays + p.leaveDays;
            const deduction = Math.max(state.settings.workingDaysPerMonth - paidDays, 0) * perDay;
            const net = Math.max(emp.salary - deduction, 0);
            return { Month: monthKey, EmployeeID: empId, PresentDays:p.presentDays, LeaveDays:p.leaveDays,
              LateCount:p.lateCount, GrossSalary: emp.salary, Deductions: Math.round(deduction), NetSalary: Math.round(net) };
          });
          await apiPost("writePayroll", { rows: payrollRows });
        }

        state.ui.syncState = {
          status:"done-monthly", fileName:file.name, employeeCount: affectedEmpIds.length,
          createdCount: createdNames.length, createdNames, dayCount: dates.size,
          dateFrom: sortedDates[0], dateTo: sortedDates[sortedDates.length-1],
        };
      } else {
        const parsed = parseAttendanceWorkbook(buffer);
        const validIds = new Set(state.employees.map(e=>e.id));
        const unmatched = Object.keys(parsed).filter(id => !validIds.has(id));
        Object.entries(parsed).forEach(([id, rec]) => { if(validIds.has(id)) state.attendance[id] = rec; });
        if(state.apiUrl){
          const rows = Object.entries(parsed).filter(([id])=>validIds.has(id)).map(([id, rec]) => ({
            Date: TODAY_ISO, EmployeeID: id, CheckIn: rec.checkIn||"", PersonalOut: rec.personalOut||"",
            PersonalIn: rec.personalIn||"", CheckOut: rec.checkOut||"",
            Status: rec.status==="present"?"Present":rec.status==="leave"?"Leave":"Absent", LeaveType: rec.leaveType||"",
          }));
          await apiPost("uploadAttendance", { rows });
        }
        state.ui.syncState = { status:"done", fileName:file.name, count: Object.keys(parsed).length - unmatched.length, unmatched };
      }
    }catch(err){
      console.error(err);
      state.ui.syncState = { status:"error", fileName:file.name, message: String(err.message || err) };
    }
    render();
  };
}

function wirePayroll(){
  const toggle = document.getElementById("toggle-add-payroll");
  if(toggle) toggle.onclick = () => setState({ui:{...state.ui, showAddPayroll: !state.ui.showAddPayroll, editPayrollId:null}});
  const cancel = document.getElementById("cancel-payroll");
  if(cancel) cancel.onclick = () => setState({ui:{...state.ui, showAddPayroll:false, editPayrollId:null}});
  const saveBtn = document.getElementById("save-payroll");
  if(saveBtn) saveBtn.onclick = async () => {
    const empId = state.ui.editPayrollId || document.getElementById("payroll-emp").value;
    const emp = state.employees.find(e => e.id === empId);
    if(!emp) return;
    const salary = Number(document.getElementById("payroll-salary").value);
    if(!isNaN(salary) && document.getElementById("payroll-salary").value !== "") emp.salary = salary;
    const entry = {
      presentDays: Number(document.getElementById("payroll-present").value) || 0,
      leaveDays: Number(document.getElementById("payroll-leave").value) || 0,
      lateCount: Number(document.getElementById("payroll-late").value) || 0,
    };
    state.payrollMock[empId] = entry;
    setState({ui:{...state.ui, showAddPayroll:false, editPayrollId:null}});
    if(state.apiUrl){
      const perDay = emp.salary / state.settings.workingDaysPerMonth;
      const paidDays = entry.presentDays + entry.leaveDays;
      const deduction = Math.max(state.settings.workingDaysPerMonth - paidDays, 0) * perDay;
      const net = Math.max(emp.salary - deduction, 0);
      await apiPost("updateEmployee", { employeeId: empId, fields: { MonthlySalary: emp.salary } });
      await apiPost("writePayroll", { rows: [{
        Month: "2026-08", EmployeeID: empId, PresentDays: entry.presentDays, LeaveDays: entry.leaveDays,
        LateCount: entry.lateCount, GrossSalary: emp.salary, Deductions: Math.round(deduction), NetSalary: Math.round(net),
      }]});
    }
  };
  document.querySelectorAll("[data-edit-payroll]").forEach(b => b.onclick = () => {
    setState({ui:{...state.ui, showAddPayroll:true, editPayrollId:b.dataset.editPayroll}});
  });
}

function wireLeave(){
  const toggle = document.getElementById("toggle-add-leave");
  if(toggle) toggle.onclick = () => setState({ui:{...state.ui, showAddLeave: !state.ui.showAddLeave, editLeaveId:null}});
  const cancel = document.getElementById("cancel-leave");
  if(cancel) cancel.onclick = () => setState({ui:{...state.ui, showAddLeave:false, editLeaveId:null}});
  const saveBtn = document.getElementById("save-leave");
  if(saveBtn) saveBtn.onclick = async () => {
    const from = document.getElementById("leave-from").value;
    const to = document.getElementById("leave-to").value || from;
    const type = document.getElementById("leave-type").value;
    if(!from) return;

    if(state.ui.editLeaveId){
      const l = state.leaves.find(l => l.id == state.ui.editLeaveId);
      if(!l) return;
      l.type = type; l.from = from; l.to = to;
      setState({ui:{...state.ui, showAddLeave:false, editLeaveId:null}});
      if(state.apiUrl) await apiPost("updateLeave", { leaveId: l.id, fields: { Type: type, FromDate: from, ToDate: to } });
      return;
    }

    const empId = document.getElementById("leave-emp").value;
    const emp = state.employees.find(e => e.id === empId);
    if(!emp) return;
    const maxId = state.leaves.reduce((m,l)=>Math.max(m, Number(l.id)||0), 0);
    const newLeave = { id: maxId + 1, empId, name: emp.name, type, from, to, status: "Pending" };
    state.leaves.push(newLeave);
    setState({ui:{...state.ui, showAddLeave:false, editLeaveId:null}});
    if(state.apiUrl){
      await apiPost("addLeave", { leave: { LeaveID: newLeave.id, EmployeeID: empId, Type: type, FromDate: from, ToDate: to, Status: "Pending" } });
    }
  };
  document.querySelectorAll("[data-edit-leave]").forEach(b => b.onclick = () => {
    setState({ui:{...state.ui, showAddLeave:true, editLeaveId:b.dataset.editLeave}});
  });
  document.querySelectorAll("[data-leave-approve]").forEach(b => b.onclick = async () => {
    const l = state.leaves.find(l=>l.id==b.dataset.leaveApprove);
    l.status = "Approved"; render();
    if(state.apiUrl) await apiPost("updateLeaveStatus", { leaveId:l.id, status:"Approved" });
  });
  document.querySelectorAll("[data-leave-reject]").forEach(b => b.onclick = async () => {
    const l = state.leaves.find(l=>l.id==b.dataset.leaveReject);
    l.status = "Rejected"; render();
    if(state.apiUrl) await apiPost("updateLeaveStatus", { leaveId:l.id, status:"Rejected" });
  });
}

function wireHolidays(){
  const toggle = document.getElementById("toggle-add-holiday");
  if(toggle) toggle.onclick = () => setState({ui:{...state.ui, showAddHoliday: !state.ui.showAddHoliday, editHolidayId:null}});
  const cancel = document.getElementById("cancel-holiday");
  if(cancel) cancel.onclick = () => setState({ui:{...state.ui, showAddHoliday:false, editHolidayId:null}});
  const saveBtn = document.getElementById("save-holiday");
  if(saveBtn) saveBtn.onclick = async () => {
    const date = document.getElementById("holiday-date").value;
    const name = document.getElementById("holiday-name").value.trim();
    if(!date || !name) return;

    if(state.ui.editHolidayId){
      const h = state.holidays.find(h => h.id == state.ui.editHolidayId);
      if(!h) return;
      const oldDate = h.date, oldName = h.name;
      h.date = date; h.name = name;
      setState({ui:{...state.ui, showAddHoliday:false, editHolidayId:null}});
      if(state.apiUrl){
        await apiPost("deleteHoliday", { date: oldDate, name: oldName });
        await apiPost("addHoliday", { holiday: { Date: date, HolidayName: name } });
      }
      return;
    }

    state.holidays.push({ id: Date.now(), date, name });
    setState({ui:{...state.ui, showAddHoliday:false, editHolidayId:null}});
    if(state.apiUrl) await apiPost("addHoliday", { holiday: { Date: date, HolidayName: name } });
  };
  document.querySelectorAll("[data-edit-holiday]").forEach(b => b.onclick = () => {
    setState({ui:{...state.ui, showAddHoliday:true, editHolidayId:b.dataset.editHoliday}});
  });
  document.querySelectorAll("[data-remove-holiday]").forEach(b => b.onclick = async () => {
    const h = state.holidays.find(h => h.id == b.dataset.removeHoliday);
    state.holidays = state.holidays.filter(h => h.id != b.dataset.removeHoliday);
    render();
    if(state.apiUrl && h) await apiPost("deleteHoliday", { date: h.date, name: h.name });
  });
}

function wireSettings(){
  const saveBtn = document.getElementById("save-settings");
  if(saveBtn) saveBtn.onclick = async () => {
    state.settings = {
      officeStart: document.getElementById("set-start").value,
      officeEnd: document.getElementById("set-end").value,
      lunchMinutes: Number(document.getElementById("set-lunch").value),
      graceMinutes: Number(document.getElementById("set-grace").value),
      weeklyOff: document.getElementById("set-weeklyoff").value,
      workingDaysPerMonth: Number(document.getElementById("set-workingdays").value),
    };
    render();
    if(state.apiUrl){
      await apiPost("updateSettings", { settings: {
        OfficeStart: state.settings.officeStart, OfficeEnd: state.settings.officeEnd,
        LunchMinutes: state.settings.lunchMinutes, GraceMinutes: state.settings.graceMinutes,
        WeeklyOff: state.settings.weeklyOff, WorkingDaysPerMonth: state.settings.workingDaysPerMonth,
      }});
    }
  };
  const testBtn = document.getElementById("test-connection");
  if(testBtn) testBtn.onclick = async () => {
    const url = document.getElementById("apiurl-input").value.trim();
    state.ui.testState = { status:"testing" };
    render();
    try{
      const res = await fetch(`${url}?action=ping`);
      const data = await res.json();
      if(data.ok){
        state.apiUrl = url;
        localStorage.setItem("tf_apiUrl", url);
        state.ui.testState = { status:"success" };
        render();
        await syncFromSheet();
        return;
      } else {
        state.ui.testState = { status:"error", message: data.error || "Unexpected response" };
      }
    }catch(err){
      state.ui.testState = { status:"error", message:"Couldn't reach that URL. Check it's a deployed Web app URL ending in /exec." };
    }
    render();
  };
  const syncBtn = document.getElementById("sync-now-btn");
  if(syncBtn) syncBtn.onclick = () => syncFromSheet();
  const resetBtn = document.getElementById("reset-data-btn");
  if(resetBtn) resetBtn.onclick = resetAppData;
}

render();
</script>
